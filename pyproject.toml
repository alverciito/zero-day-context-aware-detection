[project]
name = "kitnetzday"
version = "0.1.0"
description = "Companion code of JISAS-D-26-02300: regenerates the outputs listed in README.md from the shipped aggregate."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "A. Palomo-Alonso" },
    { name = "Khalid Achbab-Gueriguer" },
    { name = "A. Portilla-Figueras" },
    { name = "Silvia Jiménez-Fernández" },
    { name = "Enrique Alexandre-Cortizo" },
    { name = "S. Salcedo-Sanz" },
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# One entry per package in src/.
packages = ["src/kitnetzday"]

[tool.ruff]
line-length = 79
target-version = "py310"
extend-exclude = ["data", "models", "logs", "frozen"]

[tool.ruff.lint]
# pycodestyle, pyflakes, pep8-naming, annotations, import order.
select = ["E", "W", "F", "N", "ANN", "I"]
ignore = ["ANN401"]

[tool.ruff.lint.isort]
known-first-party = ["kitnetzday"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# This package accompanies one paper. What computes is unit-tested with
# hand-computed cases; what the scripts of bin/ write is compared with the
# reference outputs of data/reference/. The modules that need the per-record
# arrays or the checkpoints have no test, which is why a coverage gate is
# not enforced here. See tests/README.md.
addopts = "--import-mode=importlib"
